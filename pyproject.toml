[project]
name = "espresso-rl"
version = "0.1.0"
description = "EspressoRL — adaptive espresso optimisation for Gaggimate over MQTT"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "paho-mqtt>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "botorch>=0.10",
    "gpytorch>=1.11",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
espresso-rl = "espresso_rl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espresso_rl"]

# CPU-only PyTorch — avoids pulling CUDA wheels (~2 GB savings).
# Used by uv sync locally and in the Dockerfile.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
