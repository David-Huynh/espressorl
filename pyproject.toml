[project]
name = "grinder-ha-addon-container"
version = "0.1.0"
description = "EspressoRL — adaptive grind optimisation for Gaggimate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "botorch>=0.10",
    "gpytorch>=1.11",
]

[project.scripts]
espresso-rl = "espresso_rl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espresso_rl"]

# CPU-only PyTorch — avoids pulling CUDA wheels (~2 GB savings).
# Used both locally (uv sync --index ...) and in the Dockerfile.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
