name: espresso_rl

services:
  espresso-rl:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: espresso_rl
      POSTGRES_USER: espresso_rl
      POSTGRES_PASSWORD: espresso_rl
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
